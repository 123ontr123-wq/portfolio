# 배포 baseURL은 site/pages.json과 Actions(configure-pages)에서 주입합니다.
baseURL = "/"
title = "장민성 포트폴리오"

locale = "ko-KR"
defaultContentLanguage = "ko"
enableEmoji = false

[pagination]
pagerSize = 6


[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "장민성"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "생명과학과 AI를 함께 공부하는 장민성의 개인 포트폴리오"
keywords = "포트폴리오,생명과학,인공지능,계산생물학,Hugo"
info = ["전북대학교 생명과학 전공 · AI 부전공", "계산생물학과 바이오메디컬 AI를 향해 공부하는 중"]
avatarURL = "images/avatar.svg"
#gravatar = "john.doe@example.com"
dateFormat = "2006년 1월 2일"
since = 2026
# Git Commit in Footer, uncomment the line below to enable it
# commit = "https://github.com/OWNER/REPO/tree/"
# Right To Left, shift content direction for languages such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 5
# Custom CSS
customCSS = ["css/custom.css"]
# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

[taxonomies]
tag = "tags"

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/your-github-id/"

[languages.ko]
label = "한국어"
weight = 1

[[languages.ko.menu.main]]
name = "소개"
weight = 1
url = "about/"

[[languages.ko.menu.main]]
name = "학습 기록"
weight = 3
url = "posts/"

[[languages.ko.menu.main]]
name = "활동"
weight = 2
url = "projects/"

[[languages.ko.menu.main]]
name = "연락"
weight = 5
url = "contact/"
