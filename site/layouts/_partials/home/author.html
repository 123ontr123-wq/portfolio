<h2>{{ range .Site.Params.info }}{{ . | markdownify }}<br>{{ end}}</h2>
{{ else }}
<h2>{{ .Site.Params.info | markdownify }}</h2>
{{ end }}

  <span aria-hidden="true">·</span>
  <a href="{{ "projects/portfolio-site/" | relLangURL }}">대표 활동 보기</a>
</p>
